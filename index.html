    const rows = document.querySelector('#rows');
    const count = document.querySelector('#count');
    const search = document.querySelector('#search');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);

    function render() {
      const term = search.value.trim().toLocaleLowerCase('pt-BR');
      const filtered = unidades.filter(item =>
        [item.sigla, item.nome, item.cnpj, item.cidadeEstado, item.endereco].some(value => String(value ?? '').toLocaleLowerCase('pt-BR').includes(term))
      );
      count.textContent = `${filtered.length} ${filtered.length === 1 ? 'unidade' : 'unidades'}`;
      rows.innerHTML = filtered.length ? filtered.map(item => {
        const url = /^https:\/\//i.test(item.link ?? '') ? item.link : '';
        return `<tr><td>${escapeHtml(item.sigla || '—')}</td><td>${escapeHtml(item.nome || '—')}</td><td>${escapeHtml(item.cnpj || '—')}</td><td>${escapeHtml(item.cidadeEstado)}</td><td>${escapeHtml(item.endereco || '—')}</td><td>${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>` : '—'}</td></tr>`;
      }).join('') : `<tr><td class="empty" colspan="6">${term ? 'Nenhum resultado encontrado.' : 'Os endereços serão exibidos aqui após a inclusão da base autorizada.'}</td></tr>`;
    }
    search.addEventListener('input', render);
    render();
